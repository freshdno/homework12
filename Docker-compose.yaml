        image: tomcat:9.0.111-jre21-temurin-jammy
        ports:
            - '8080:8080'
        volumes:
            - app:/usr/local/tomcat/webapps
        depends_on:
            - builder
    builder:
        build:
            context: .
        volumes:
           - app:/root/homework12/App42PaaS-Java-MySQL-Sample/target

    db:
        image: mysql:latest
        restart: always
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: your_root_password
            MYSQL_DATABASE: my_database
            MYSQL_USER: acp4pogynvaeidfj
            MYSQL_PASSWORD: my_user_password


volumes:
    app: